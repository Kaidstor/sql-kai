[package]
name = "sql-kai"
version = "1.1.1"
description = "Postgres client with SSH tunnels"
authors = ["kaidstor"]
edition = "2021"
# `cargo run` (tauri dev) must pick the app, not the kai CLI bin
default-run = "sql-kai"

[lib]
name = "sql_kai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI поверх того же ядра (db/store/vault/tunnel). Собирается только с
# фичей cli, чтобы GUI-сборка не тянула clap:
#   cargo build --release --features cli --bin kai
[[bin]]
name = "kai"
path = "src/bin/kai/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:rpassword"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-postgres = "0.7"
# SCRAM-verifier для `kai rotate` — пароль не уходит на сервер открытым текстом
postgres-protocol = "0.6"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
arboard = "3.6"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"
clap = { version = "4", features = ["derive", "wrap_help"], optional = true }
rpassword = { version = "7", optional = true }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"
