[package]
name = "sql-kai"
version = "1.29.0"
description = "Postgres client with SSH tunnels"
authors = ["kaidstor"]
edition = "2021"
# `cargo run` (tauri dev) must pick the app, not the sql-kai-cli bin
default-run = "sql-kai"

[lib]
name = "sql_kai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI поверх того же ядра (db/store/vault/tunnel). Собирается только с
# фичей cli, чтобы GUI-сборка не тянула clap:
#   cargo build --release --features cli --bin sql-kai-cli
# Target назван sql-kai-cli, а не sql-kai: это имя занято GUI-бинарём пакета
# (и файлом Contents/MacOS/sql-kai внутри .app). Команда для пользователя —
# `sql-kai`: симлинк install-cli указывает на этот бинарь.
[[bin]]
name = "sql-kai-cli"
path = "src/bin/sql-kai-cli/main.rs"
required-features = ["cli"]

[features]
default = []
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:rpassword",
    "dep:rusqlite",
    "dep:aes",
    "dep:cbc",
    "dep:sha2",
    "dep:hex",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: Map хранит ключи в порядке вставки/чтения. Без этого
# `mcp install` пересортировывал бы по алфавиту ВЕСЬ чужой конфиг клиента
# (~/.gemini/settings.json и т.п.) — данные целы, но диff во весь файл.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "io-util", "io-std", "sync"] }
tokio-postgres = "0.7"
# TLS для прямых (без ssh-туннеля) подключений. native-tls на macOS = Secure
# Transport (системная связка ключей для verify-full), без зависимости от OpenSSL.
native-tls = "0.2"
postgres-native-tls = "0.5"
# SCRAM-verifier для `sql-kai rotate` — пароль не уходит на сервер открытым текстом
postgres-protocol = "0.6"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
arboard = "3.6"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"
clap = { version = "4", features = ["derive", "wrap_help"], optional = true }
# генератор скриптов автодополнения (`sql-kai completion`); только aot-часть,
# unstable-dynamic не включаем — дополнение профилей сделано своим эпилогом
clap_complete = { version = "4", optional = true }
rpassword = { version = "7", optional = true }
# `import --from beekeeper|dbeaver`: чужой клиент читается своим форматом —
# Beekeeper держит подключения в sqlite (bundled: не зависеть от системной
# libsqlite3), пароли в обоих — AES-CBC, ключ у Beekeeper = sha256 от строки.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
rust_xlsxwriter = "0.96.0"
futures-util = "0.3.32"
tauri-plugin-window-state = "2"
# flock(2) для межпроцессной блокировки записи в конфиг (GUI ↔ CLI)
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"
